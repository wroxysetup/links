const toks=s=>norm(s).split(" ").filter(Boolean);
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function tokMatch(q,t){if(t.includes(q))return true;if(q.length<3)return false;
 const lim=q.length>=7?2:q.length>=4?1:0;if(!lim)return false;
 return lev(q,t)<=lim||lev(q,t.slice(0,q.length))<=lim||(t.length>q.length&&lev(q,t.slice(0,q.length+1))<=lim)}
const docMatch=(qs,doc)=>qs.every(q=>doc.some(t=>tokMatch(q,t)));

async function loadStats(){const out=$("stats");out.innerHTML='<p class="msg">Yükleniyor…</p>';
 try{const db=window.claude&&claude.use?await claude.use("db"):null;
  if(!db){out.innerHTML='<p class="msg err">Veritabanına bağlanılamadı. Paneli claude.ai hesabınla, sayfanın sahibi olarak açtığından emin ol.</p>';return}

  <div class="card"><h2 style="font-size:1rem;margin-bottom:8px">Ziyaretçiler</h2><div class="ov"><table class="tb"><tr><th>Kim</th><th>Cihaz</th><th>Sayfada kaldı</th><th>Tık</th><th>En çok tıkladığı</th><th>Son görülme</th></tr>${rows.length?rows.sort((a,b)=>(b.last||0)-(a.last||0)).map(r=>{const c=Object.entries(r.clicks||{}).sort((a,b)=>b[1]-a[1]);return `<tr><td>${who(r)}</td><td>${esc(r.device||"-")}</td><td>${fmt(r.seconds||0)}</td><td>${c.reduce((t,x)=>t+x[1],0)}</td><td>${c.length?esc(pn(c[0][0])):"-"}</td><td>${r.last?new Date(r.last).toLocaleString("tr-TR"):"-"}</td></tr>`}).join(""):'<tr><td colspan="6" class="msg">Henüz ziyaretçi kaydı yok.</td></tr>'}</table></div></div>`
 }catch(e){out.innerHTML='<p class="msg err">Veriler okunamadı: '+esc(e&&e.message||e)+'</p>'}}

(()=>{const FX=".c,.soc a,.soc button,.mb,nav.cn a";

(()=>{const cv=$("sky"),x=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;let w,h,st=[],sh=[];
function size(){w=cv.width=innerWidth;h=cv.height=innerHeight;st=Array.from({length:Math.min(260,w*h/5500|0)},()=>{const big=Math.random()<.15;return{x:Math.random()*w,y:Math.random()*h,r:big?Math.random()*.9+1.3:Math.random()*.9+.3,p:Math.random()*6.28,v:Math.random()*.004+.0015,d:(Math.random()*.12+.03)*(big?2:1),c:Math.random()<.3?"#8fb8ff":"#e8f0ff"}})}
function draw(t){x.clearRect(0,0,w,h);
 for(const s of st){if(!still){s.x-=s.d;if(s.x<-3)s.x=w+3}
  x.globalAlpha=still?.7:.35+.65*Math.abs(Math.sin(s.p+t*s.v));x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
 if(still)return;
 if(Math.random()<.02&&sh.length<4)sh.push({x:w*(.25+Math.random()*.85),y:Math.random()*h*.5,vx:-(9+Math.random()*7),vy:4+Math.random()*4,l:1});
 sh=sh.filter(m=>{m.x+=m.vx;m.y+=m.vy;m.l-=.011;if(m.l<=0||m.x<-200||m.y>h+200)return false;
  const tx=m.x-m.vx*16,ty=m.y-m.vy*16,g=x.createLinearGradient(m.x,m.y,tx,ty);
  g.addColorStop(0,"rgba(255,255,255,"+m.l+")");g.addColorStop(.3,"rgba(140,185,255,"+m.l*.6+")");g.addColorStop(1,"rgba(67,139,238,0)");
  x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=2.4;x.lineCap="round";x.shadowColor="#438BEE";x.shadowBlur=14;
  x.beginPath();x.moveTo(m.x,m.y);x.lineTo(tx,ty);x.stroke();x.shadowBlur=0;
  x.fillStyle="rgba(255,255,255,"+m.l+")";x.beginPath();x.arc(m.x,m.y,2.2,0,6.283);x.fill();return true});
 requestAnimationFrame(draw)}
size();addEventListener("resize",()=>{size();if(still)draw(0)});requestAnimationFrame(draw)})();
