<style>:root{--bg:#08090B;--bg2:#101217;--card:#15171C;--tx:#F5F6F8;--tx2:#9299A6;--ac:#438BEE;--bd:rgba(255,255,255,.07);--r:16px;--acrgb:67,139,238}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(60% 40% at 50% -5%,rgba(var(--acrgb),.16),transparent 70%);background-repeat:no-repeat}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:40px 20px 56px}
header.p{text-align:center;display:grid;justify-items:center;gap:8px;animation:in .7s ease both}
.logo{object-fit:cover;width:92px;height:92px;border-radius:26px;box-shadow:0 0 0 1px var(--bd),0 18px 40px -12px rgba(var(--acrgb),.35)}
h1{font-size:1.6rem;font-weight:600;margin-top:10px}.u{color:var(--ac);font-size:.9rem}
.d{color:var(--tx2);max-width:420px}
.soc{display:flex;gap:10px;margin-top:8px}
.soc button{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;color:var(--tx2);padding:0;cursor:pointer;transition:.2s}.soc button:hover{color:var(--tx);border-color:rgba(var(--acrgb),.6);transform:translateY(-2px)}
.mb{display:block;width:100%;text-align:center;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);margin-top:8px;cursor:pointer;color:var(--tx);font:500 .9rem "DM Sans",sans-serif}.mb.pr{background:var(--ac);border-color:var(--ac)}
.soc a{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;color:var(--tx2);transition:.2s}
.soc a:hover{color:var(--tx);border-color:rgba(var(--acrgb),.6);transform:translateY(-2px)}
.feat{display:flex;align-items:center;gap:16px;margin:28px 0 8px;padding:20px;border-radius:20px;border:1px solid rgba(var(--acrgb),.35);
 background:linear-gradient(135deg,rgba(var(--acrgb),.18),rgba(21,23,28,.9) 55%);box-shadow:0 20px 50px -24px rgba(var(--acrgb),.6);transition:.25s}
.feat:hover{transform:translateY(-3px);border-color:var(--ac)}
.feat .ic{width:48px;height:48px;border-radius:14px;background:rgba(var(--acrgb),.15);color:var(--ac);display:grid;place-items:center}
.feat h2{font-size:1.15rem}.feat p{color:var(--tx2);font-size:.9rem}.feat .ar{margin-left:auto;color:var(--ac)}
.setup{margin:28px auto 0;max-width:420px;border-radius:20px;overflow:hidden;border:1px solid var(--bd);background:var(--card);box-shadow:0 20px 50px -28px rgba(var(--acrgb),.5)}.setup img{display:block;width:100%;height:auto}.setup figcaption{padding:10px 14px;color:var(--tx2);font-size:.85rem}
.sr{position:relative;margin-top:28px}.sr .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx2);pointer-events:none}.sr input{padding:13px 14px 13px 44px;border-radius:14px;font-size:16px;background:var(--card)}.sr input:focus{border-color:rgba(var(--acrgb),.6);outline:none}
.c[hidden],#list section[hidden],nav.cn[hidden]{display:none!important}
nav.cn{margin-top:12px!important;position:sticky;top:0;z-index:5;margin:0 -20px;padding:12px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:rgba(8,9,11,.85);backdrop-filter:blur(10px)}
nav.cn a{flex:none;padding:8px 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);font-size:.85rem;transition:.2s}
nav.cn a:hover{color:var(--tx);border-color:var(--ac)}
section{margin-top:28px}section h2{font-size:1rem;font-weight:500;color:var(--tx2);margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.c{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);transition:.2s;min-width:0}
.c:hover{transform:translateY(-2px);border-color:rgba(var(--acrgb),.5);box-shadow:0 14px 30px -18px rgba(var(--acrgb),.5)}
.c .ic{width:40px;height:40px;border-radius:12px;background:var(--bg2);color:var(--ac);display:grid;place-items:center;flex:none}
.c .ic img{width:22px;height:22px;object-fit:contain}
.c b{display:block;font:500 .92rem "Space Grotesk",sans-serif;line-height:1.25}.c small{color:var(--tx2);font-size:.78rem;line-height:1.3;display:block;margin-top:2px}
.c .ar{margin-left:auto;color:var(--tx2);width:16px;height:16px}.c div{min-width:0}
footer{text-align:center;color:var(--tx2);font-size:.8rem;margin-top:48px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(max-width:520px){.g{grid-template-columns:1fr}.wrap{padding-top:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* admin */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
label{display:grid;gap:4px;color:var(--tx2);font-size:.82rem;margin-bottom:10px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font:inherit}
button{font:500 .9rem "DM Sans",sans-serif;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff}button.dg{color:#ff7b7b}button:hover{filter:brightness(1.15)}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg2);margin-bottom:8px;cursor:grab}
.row.off{opacity:.45}.row.drag{outline:1px dashed var(--ac)}.row .t{flex:1;min-width:0}.row .t small{color:var(--tx2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:20px;width:min(480px,92vw)}dialog::backdrop{background:rgba(0,0,0,.7)}
.msg{color:var(--tx2);font-size:.85rem;margin:8px 0}.msg.err{color:#ff7b7b}

/* admin */
.tb{width:100%;border-collapse:collapse;font-size:.85rem}.tb th,.tb td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}.tb th{color:var(--tx2);font-weight:500}
.ov{overflow-x:auto}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.sum .card{margin:0}.sum b{display:block;font:600 1.4rem "Space Grotesk",sans-serif}.sum small{color:var(--tx2)}
.bar2{height:6px;border-radius:4px;background:var(--ac);min-width:4px}
/* tema seçici */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.mb.th{display:flex;align-items:center;gap:9px;margin:0;text-align:left;width:auto}
.th i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}.mb.th.on{border-color:var(--ac)}
/* efektler */
.c,.soc a,.soc button,.mb,nav.cn a{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent}
.c::before,.soc a::before,.soc button::before,.mb::before,nav.cn a::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(130px circle at var(--mx,50%) var(--my,50%),rgba(var(--acrgb),.3),transparent 70%)}
.c:hover::before,.soc a:hover::before,.soc button:hover::before,.mb:hover::before,nav.cn a:hover::before{opacity:1}
.c::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-20deg);transition:left .65s ease}
.c:hover::after{left:140%}
.c .ar{transition:transform .25s,color .25s}.c:hover .ar{transform:translate(3px,-3px);color:var(--ac)}
.c .ic{transition:transform .3s,box-shadow .3s,background .3s}.c:hover .ic{background:rgba(var(--acrgb),.16);box-shadow:0 0 20px -4px rgba(var(--acrgb),.8);transform:scale(1.1) rotate(-5deg)}
.soc svg{transition:transform .25s}.soc a:hover svg,.soc button:hover svg{transform:scale(1.18) rotate(-6deg)}
.soc a:hover,.soc button:hover{box-shadow:0 10px 24px -10px rgba(var(--acrgb),.8)}
.mb:hover{border-color:rgba(var(--acrgb),.6)}
.c:active,.soc a:active,.soc button:active,.mb:active,nav.cn a:active{transform:scale(.96)}
.sr input{transition:box-shadow .25s,border-color .25s}.sr input:focus{box-shadow:0 0 0 4px rgba(var(--acrgb),.15),0 10px 30px -14px rgba(var(--acrgb),.7)}
.rp{position:absolute;border-radius:50%;background:rgba(var(--acrgb),.5);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){.rp,.c::after{display:none}}
/* menü ve netflix görünümü */
.hb{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:20;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:14px;background:rgba(21,23,28,.85);backdrop-filter:blur(8px);color:var(--tx2);transition:.2s}
.hb:hover{color:var(--tx);border-color:rgba(var(--acrgb),.6)}.hb:active{transform:scale(.94)}
nav.cn{padding-right:72px!important}
#mn{margin:calc(64px + env(safe-area-inset-top,0px)) 14px auto auto;width:min(300px,92vw)}#mn .msg{margin:12px 0 6px}
.mb.vw,.mb.lg{margin:0}.mb.vw.on,.mb.lg.on{border-color:var(--ac);color:var(--ac)}
.rw{position:relative}.ra{display:none}
.nf nav.cn{display:none}
.nf .g{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 14px;scroll-padding-left:20px;scrollbar-width:none}
.nf .g::-webkit-scrollbar{display:none}
.nf .c{flex:0 0 200px;scroll-snap-align:start;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;min-height:150px}
.nf .c .ic{width:48px;height:48px;border-radius:14px}.nf .c .ar{position:absolute;top:14px;right:14px;margin:0}.nf .c div{width:100%}.nf .c small{margin-top:4px}
@media(hover:hover){.nf .rw:hover .ra{display:grid}}
.ra{position:absolute;top:0;bottom:14px;width:48px;place-items:center;z-index:3;border:0;border-radius:0;padding:0;font-size:30px;color:#fff;background:linear-gradient(to right,rgba(8,9,11,.92),transparent)}
.ra.l{left:-20px}.ra.r{right:-20px;background:linear-gradient(to left,rgba(8,9,11,.92),transparent)}
/* 3d eğilme + toast */
.c:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
.c:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(.97)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:14px;background:rgba(21,23,28,.95);border:1px solid rgba(var(--acrgb),.6);color:var(--tx);box-shadow:0 14px 40px -12px rgba(var(--acrgb),.8);animation:tin .4s ease both}
@keyframes tin{from{opacity:0}}
/* ---- siyah-beyaz tema (görseller ve efektler renkli kalır) ---- */
:root{--bg:#000!important;--bg2:#0c0c0c!important;--card:#111!important;--tx:#fff!important;--tx2:#8f8f8f!important;--ac:#fff!important;--acrgb:255,255,255!important;--bd:rgba(255,255,255,.12)!important}
body{background-image:none!important}
.mb.pr{background:#fff!important;color:#000!important;border-color:#fff!important}
.mb.vw.on,.mb.lg.on{color:#fff!important;border-color:#fff!important;background:#1c1c1c!important}
nav.cn,.hb{background:rgba(0,0,0,.9)!important}
.ra{background:linear-gradient(to right,rgba(0,0,0,.92),transparent)!important}.ra.r{background:linear-gradient(to left,rgba(0,0,0,.92),transparent)!important}
.nw{font:700 .62rem/1 "DM Sans",sans-serif;font-style:normal;letter-spacing:.05em;background:#fff;color:#000;padding:3px 7px;border-radius:99px;margin-left:8px;vertical-align:middle}
</style>

const T={ok:false,q:Promise.resolve(),dirty:false};
function save(){if(!T.ok)return;T.dirty=false;T.q=T.q.then(()=>T.doc.set(T.data)).catch(()=>{T.ok=false})}
(async()=>{try{

 const g=await T.doc.get();T.data=g.exists?{...g.data()}:{first:Date.now(),seconds:0,clicks:{}};
 T.data.clicks=T.data.clicks||{};T.data.device=matchMedia("(max-width:700px)").matches?"Telefon":"Bilgisayar";T.data.last=Date.now();T.ok=true;save();
 setInterval(()=>{if(document.visibilityState==="visible"){T.data.seconds=(T.data.seconds||0)+15;T.data.last=Date.now();T.dirty=true}},15000);
 setInterval(()=>{if(T.dirty)save()},30000);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&T.dirty)save()});
 document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest("#list .c");if(!c||!T.ok)return;const k="i"+c.dataset.i;T.data.clicks[k]=(T.data.clicks[k]||0)+1;T.data.last=Date.now();save()});
}catch(e){}})();

async function loadStats(){const out=$("stats");out.innerHTML='<p class="msg">Yükleniyor…</p>';

  const snap=await db.collection("visitors").get(),rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  const user=await claude.use("user");let names={};if(user)try{names=await user.profiles(rows.map(r=>r.id))}catch(e){}
  const tot={};let clicks=0,secs=0;
  rows.forEach(r=>{secs+=r.seconds||0;Object.entries(r.clicks||{}).forEach(([k,n])=>{tot[k]=(tot[k]||0)+n;clicks+=n})});
  const pn=k=>(W.links[+String(k).slice(1)]||[])[1]||k,top=Object.entries(tot).sort((a,b)=>b[1]-a[1]),max=top.length?top[0][1]:1;

  <div class="card"><h2 style="font-size:1rem;margin-bottom:8px">Ziyaretçiler</h2><div class="ov"><table class="tb"><tr><th>Kim</th><th>Cihaz</th><th>Sayfada kaldı</th><th>Tık</th><th>En çok tıkladığı</th><th>Son görülme</th></tr>${rows.length?rows.sort((a,b)=>(b.last||0)-(a.last||0)).map(r=>{const c=Object.entries(r.clicks||{}).sort((a,b)=>b[1]-a[1]);return `<tr><td>${who(r)}</td><td>${esc(r.device||"-")}</td><td>${fmt(r.seconds||0)}</td><td>${c.reduce((t,x)=>t+x[1],0)}</td><td>${c.length?esc(pn(c[0][0])):"-"}</td><td>${r.last?new Date(r.last).toLocaleString("tr-TR"):"-"}</td></tr>`}).join(""):'<tr><td colspan="6" class="msg">Henüz ziyaretçi kaydı yok.</td></tr>'}</table></div></div>`
 }catch(e){out.innerHTML='<p class="msg err">Veriler okunamadı: '+esc(e&&e.message||e)+'</p>'}}

ag:{n:["Parçacık Ağı","Particle Network"],ac:"56,189,248",mk(){const n=Math.min(70,w*h/16000|0)+20,p=Array.from({length:n},()=>({x:R()*w,y:R()*h,vx:(R()-.5)*.5,vy:(R()-.5)*.5}));

hiper:{n:["Hiper Uzay","Hyperspace"],ac:"168,85,247",secret:1,mk(){
 const N=Math.min(220,w*h/3500|0)+60,cx=w/2,cy=h/2,mx=Math.hypot(cx,cy);let rings=[],bursts=[],hue=260,lR=0,lB=0,fc=0;
